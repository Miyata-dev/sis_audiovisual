services:
  proxy:
    image: nginx:stable-alpine
    container_name: sis-audiovisual-proxy
    ports:
      - "80:80" # Expuesto para que el nginx-proxy de GCP o localhost se conecten aquí
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sis-audiovisual-frontend
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sis-audiovisual-backend
    env_file:
      - ./backend/.env
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: sis-audiovisual-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  # ai-service:
  #   build:
  #     context: ./ai-service
  #   container_name: sis-audiovisual-ai
  #   env_file:
  #     - ./ai-service/.env
  #   restart: always
  #   networks:
  #     - app-network
  #   # agregar health-check

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: