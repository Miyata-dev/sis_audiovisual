services:
  proxy:
    image: nginx:stable-alpine
    container_name: sis-audiovisual-proxy
    ports:
      - "80:80" 
    volumes:
      - ./infrastructure/proxy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro 
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./services/frontend 
      dockerfile: Dockerfile
    container_name: sis-audiovisual-frontend
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./services/backend 
      dockerfile: Dockerfile
    container_name: sis-audiovisual-backend
    env_file:
      - ./services/backend/.env 
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  ai-service:
    build:
      context: ./services/ai-service 
      dockerfile: Dockerfile
    container_name: sis-audiovisual-ai
    env_file:
      - ./services/ai-service/.env
    environment:
      - OLLAMA_URL=http://ollama:11434  
      - OLLAMA_MODEL=llama3.2:3b
    restart: always
    networks:
      - app-network

  ollama:
    build:
      context: ./services/ollama
      dockerfile: Dockerfile
    container_name: sis-audiovisual-ollama
    volumes:
      - ollama_data:/root/.ollama 
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  ollama_data:  