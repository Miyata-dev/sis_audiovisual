services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sis-audiovisual-backend
    ports:
      - "3001:3000"
    env_file:
    - ./backend/.env  
    restart: always
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sis-audiovisual-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge